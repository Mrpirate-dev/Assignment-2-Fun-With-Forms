<div id="demo"></div>
<script>
let text = '{ "employees" : [' +
'{ "firstName":"John" , "lastName":"Doe" },' +
'{ "firstName":"Anna" , "lastName":"Smith" },' +
'{ "firstName":"Peter" , "lastName":"Jones" } ]}';
let obj = JSON.parse(text);
let list = "";
for (let i = 0; i < obj.employees.length; i++) {
    list += `<li>${obj.employees[i].firstName} ${obj.employees[i].lastName}</li>`;
}
document.getElementById("demo").innerHTML = `<ul>${list}</ul>`;
</script>
</body>
